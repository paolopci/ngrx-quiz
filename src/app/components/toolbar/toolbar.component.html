@if (titleLink()) {
    <a class="title" [routerLink]="titleLink()" (click)="titleClicked.emit()">
        @if (icon()) {
            <mat-icon>{{icon()}}</mat-icon>
        }
        <span>{{caption()}}</span>
    </a>
} @else {
    <span class="title" (click)="titleClicked.emit()">
        @if (icon()) {
            <mat-icon>{{icon()}}</mat-icon>
        }
        <span>{{caption()}}</span>
    </span>
}

<span class="spacer"></span>
<ng-content />
